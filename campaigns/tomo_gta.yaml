# TOMO GTA VI Clipping (Clipping Nation). Brief: campaigns/briefs/gta_streamers.md
id: df6de26f-86ec-4782-b818-1fc8053b99a4
name: TOMO GTA VI
niche: gaming
streamer: Tomo
accounts: {youtube: vicevisionclips, instagram: vicevisionclips, tiktok: vicevisionclips}
platforms: [tiktok, instagram, youtube]
sources: ["https://www.youtube.com/@Tomovids/live"]
payout_cpm: {tiktok: 2.00, instagram: 2.00, youtube: 2.00}   # $4 min (2K views), $150 max
editing:
  brief: |
    Tomo is a gaming YouTuber (1M subscribers) streaming GTA VI live on YouTube from launch day.
    The goal is to make new viewers discover Tomo and subscribe. Clip his best GTA VI moments:
    funny reactions, chaos, fails, surprising discoveries. Tomo must be in the clip. No
    misleading titles or fake context, never portray him negatively. Skip story spoilers.
  candidates: 10
  supercut: {enabled: false}
  tighten: {enabled: false}
  headline: {enabled: true, style: "starts with Tomo, then what happens, e.g. 'Tomo found the best car in GTA 6'"}
  cold_open: true
  end_on_payoff: true
  learn_from_top_clips: true
overlays: {}
caption:
  must_contain: ["#tomovids", "#gta6", "@Tomovids", "Subscribe to Tomo on YouTube"]
  hashtags: ["#tomovids", "#gta6"]
  templates:
    - "Tomo {hook}\nSubscribe to Tomo on YouTube @Tomovids\n{hashtags}"
    - "{hook} 😭\nSubscribe to Tomo on YouTube @Tomovids for more\n{question} 👇\n{hashtags}"
pinned_comment: {platforms: [], replies: []}
preferences: {styles: [big_reaction, funny, chaos]}
clip: {min_seconds: 15, max_seconds: 60}
forbid: [spoilers, ad_like, negative_portrayal, explicit]
banned_words: []
submit_within_minutes: 30
min_live_days: 30
