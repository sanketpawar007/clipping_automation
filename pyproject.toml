[project]
name = "viral-clipper"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=2.8.0",
    "assemblyai>=1.10.0",
    "curl-cffi>=0.17.0",
    "fastapi>=0.163.1",
    "faster-whisper>=1.2.1",
    "google-genai>=3.3.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "numpy>=2.5.5",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=13.0.0",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.34",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "typer>=0.29.1",
    "uvicorn[standard]>=0.54.0",
    "yt-dlp>=2026.10.26",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"app/core/captions.py" = ["E501"]
